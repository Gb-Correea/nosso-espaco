<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nosso Espaço ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/static/css/main.css">
</head>
<body>

<!-- Particles Canvas -->
<canvas id="particles-canvas"></canvas>

<!-- Main App -->
<div id="app">

  <!-- Carousel Section -->
  <div id="carousel-container">
    <div id="carousel-track"></div>
    
    <!-- Overlay gradient -->
    <div class="carousel-overlay"></div>
    
    <!-- Top bar -->
    <div id="top-bar">
      <div id="couple-title">
        <span id="name1">{{ config.couple_names[0] }}</span>
        <span class="heart-sep">❤</span>
        <span id="name2">{{ config.couple_names[1] }}</span>
      </div>
      <div id="days-counter">
        <span id="days-num">...</span>
        <span id="days-label">dias juntos</span>
      </div>
    </div>

    <!-- Message overlay -->
    <div id="message-overlay">
      <p id="message-text"></p>
    </div>

    <!-- Controls -->
    <div id="controls-bar">
      <button class="ctrl-btn" id="btn-prev" title="Anterior">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="ctrl-btn" id="btn-playpause" title="Play/Pause">
        <svg id="icon-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        <svg id="icon-play" viewBox="0 0 24 24" style="display:none"><polygon points="5,3 19,12 5,21"/></svg>
      </button>
      <button class="ctrl-btn" id="btn-shuffle" title="Aleatório">
        <svg viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      </button>
      <button class="ctrl-btn" id="btn-next" title="Próximo">
        <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <button class="ctrl-btn" id="btn-fitmode" title="Alternar: Imagem Completa / Preencher Tela">
        <svg id="icon-contain" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor" opacity="0.4"/></svg>
      </button>
      <button class="ctrl-btn" id="btn-fullscreen" title="Tela Cheia">
        <svg id="icon-expand" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        <svg id="icon-compress" viewBox="0 0 24 24" style="display:none"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>
      </button>
    </div>

    <!-- Progress dots -->
    <div id="progress-dots"></div>

    <!-- Speed control -->
    <div id="speed-panel">
      <label>⏱ <span id="speed-val">5s</span></label>
      <input type="range" id="speed-slider" min="2" max="20" value="5" step="1">
    </div>
  </div>

  <!-- Music Player -->
  <div id="music-player" class="glass-panel">
    <div id="music-info">
      <div id="music-disc">🎵</div>
      <div id="music-meta">
        <div id="music-title">Nenhuma música</div>
        <div id="music-artist">Adicione músicas no painel</div>
      </div>
    </div>
    <div id="music-controls">
      <button class="music-btn" id="mprev">⏮</button>
      <button class="music-btn" id="mplay">▶</button>
      <button class="music-btn" id="mnext">⏭</button>
    </div>
    <div id="music-progress">
      <span id="mtime-cur">0:00</span>
      <input type="range" id="mseek" min="0" max="100" value="0">
      <span id="mtime-total">0:00</span>
    </div>
    <div id="volume-row">
      <span>🔊</span>
      <input type="range" id="vol-slider" min="0" max="100" value="70">
    </div>
    <audio id="audio-player"></audio>
  </div>

  <!-- Timeline -->
  <div id="timeline-section" class="glass-panel">
    <h2 class="section-title">Nossa História ✨</h2>
    <div id="timeline-list"></div>
  </div>

  <!-- Footer -->
  <div id="footer-bar">
    <a href="/admin" class="admin-link">⚙️ Gerenciar</a>
    <span id="footer-ip">📱 Acesse pelo celular: <span id="ip-display">{{ local_ip }}:5000</span></span>
    <a href="/logout" class="admin-link" style="margin-left:1rem;opacity:0.6;">🔒 Sair</a>
  </div>

</div>

<script>
  const CONFIG = {{ config | tojson }};
  const PHOTOS = {{ photos | tojson }};
  const VIDEOS = {{ videos | tojson }};
  const MUSIC  = {{ music  | tojson }};
</script>
<script src="/static/js/particles.js"></script>
<script src="/static/js/carousel.js"></script>
<script src="/static/js/music.js"></script>
<script src="/static/js/timeline.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
