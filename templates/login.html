<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nosso Espaço 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0608;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
  }

  /* Animated hearts background */
  .hearts-bg {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
  }
  .heart {
    position: absolute;
    bottom: -60px;
    font-size: 1.5rem;
    opacity: 0;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translateY(0) rotate(-15deg) scale(0.8); }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.3; }
    100% { opacity: 0; transform: translateY(-110vh) rotate(15deg) scale(1.2); }
  }

  /* Card */
  .card {
    position: relative; z-index: 1;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,150,180,0.15);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 3rem 2.5rem;
    width: min(420px, 92vw);
    text-align: center;
    box-shadow: 0 0 60px rgba(220,50,100,0.12), 0 20px 60px rgba(0,0,0,0.5);
  }

  .emoji { font-size: 3rem; margin-bottom: 0.5rem; display: block;
           animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50%      { transform: scale(1.12); }
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    font-weight: 400;
    color: #f0ccd8;
    letter-spacing: 0.04em;
    margin-bottom: 0.3rem;
  }
  .sub {
    color: rgba(240,180,200,0.5);
    font-size: 0.82rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 2rem;
  }

  .input-wrap {
    position: relative;
    margin-bottom: 1.2rem;
  }
  .input-wrap input {
    width: 100%;
    padding: 0.9rem 3rem 0.9rem 1.2rem;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,150,180,0.2);
    border-radius: 12px;
    color: #f0ccd8;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    outline: none;
    transition: border-color .25s, box-shadow .25s;
    letter-spacing: 0.12em;
  }
  .input-wrap input::placeholder { color: rgba(240,180,200,0.3); letter-spacing: normal; }
  .input-wrap input:focus {
    border-color: rgba(220,80,120,0.6);
    box-shadow: 0 0 0 3px rgba(220,80,120,0.12);
  }
  .toggle-eye {
    position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    color: rgba(240,180,200,0.4); font-size: 1.1rem; padding: 0;
    transition: color .2s;
  }
  .toggle-eye:hover { color: rgba(240,180,200,0.8); }

  .error {
    background: rgba(220,50,80,0.15);
    border: 1px solid rgba(220,50,80,0.3);
    border-radius: 10px;
    color: #f09090;
    font-size: 0.88rem;
    padding: 0.6rem 1rem;
    margin-bottom: 1rem;
  }

  button[type="submit"] {
    width: 100%;
    padding: 0.9rem;
    background: linear-gradient(135deg, #c0385a, #8b1a35);
    border: none; border-radius: 12px;
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: opacity .25s, transform .15s;
    box-shadow: 0 4px 20px rgba(180,40,80,0.35);
  }
  button[type="submit"]:hover  { opacity: 0.88; }
  button[type="submit"]:active { transform: scale(0.98); }

  .footer-hint {
    margin-top: 1.8rem;
    color: rgba(240,180,200,0.25);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>

<div class="hearts-bg" id="heartsContainer"></div>

<div class="card">
  <span class="emoji">💕</span>
  <h1>Nosso Espaço</h1>
  <p class="sub">Espaço privado do casal</p>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/login">
    <div class="input-wrap">
      <input type="password" id="senha" name="senha"
             placeholder="Digite a senha secreta…"
             autocomplete="current-password" autofocus required>
      <button type="button" class="toggle-eye" onclick="togglePwd()" title="Mostrar/Ocultar">👁</button>
    </div>
    <button type="submit">Entrar ❤️</button>
  </form>

  <p class="footer-hint">Só o casal sabe entrar aqui 🌹</p>
</div>

<script>
function togglePwd() {
  const f = document.getElementById('senha');
  f.type = f.type === 'password' ? 'text' : 'password';
}

// Floating hearts
const emojis = ['💕','🌹','✨','💝','🦋','💖','🌸','💫'];
const c = document.getElementById('heartsContainer');
for (let i = 0; i < 18; i++) {
  const h = document.createElement('div');
  h.className = 'heart';
  h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
  h.style.left = Math.random() * 100 + 'vw';
  h.style.fontSize = (0.9 + Math.random() * 1.4) + 'rem';
  h.style.animationDuration = (8 + Math.random() * 12) + 's';
  h.style.animationDelay = (Math.random() * 10) + 's';
  c.appendChild(h);
}
</script>
</body>
</html>
